[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "typesafe-unofficial-cli"
version = "0.2.0"
description = "Unofficial command-line interface for TypeSafe AI System One models, on TypeSafe or OpenRouter, built on typesafe-sdk"
readme = "README.md"
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
license = "MIT"
requires-python = ">=3.14"
keywords = ["typesafe", "openrouter", "system-one", "jev", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "keyring>=25.0",
  "platformdirs>=4.0",
  "pydantic>=2.12",
  "rich>=14.0",
  "tomli-w>=1.0",
  "typer>=0.16",
  "typesafe-sdk>=0.7.2,<0.8",
]

[project.scripts]
typesafe = "typesafe_unofficial_cli.main:run"

[dependency-groups]
dev = [
  "conventional-git>=1.1",
  "mypy>=2.3.1",
  "pylint-gajaguar>=2.0.1",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90 -m 'not live'"
markers = [
  "live: hits a real System One endpoint (requires TYPESAFE_TEST_API_KEY)",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
# Typer resolves command signatures at runtime, so their annotation imports must stay real imports.
lint.per-file-ignores."src/typesafe_unofficial_cli/commands/**/*.py" = ["typing-only-standard-library-import", "typing-only-third-party-import"]
lint.per-file-ignores."tests/**/*.py" = ["ARG", "boolean-type-hint-positional-argument", "magic-value-comparison", "assert", "too-many-arguments", "too-many-positional-arguments"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]
