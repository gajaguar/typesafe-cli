name: python
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - run: make check
      - run: make test
