# checkmake config. See: checkmake list-rules
#
# checkmake has no per-target scoping and no "Disable" flag for a rule (that
# key doesn't exist in the tool despite appearing plausible) — each rule only
# exposes the parameters below, so effectively disabling one means pushing
# that parameter to a no-op value.

# minphony assumes a build Makefile's "all"/"clean"/"test" targets. This
# Makefile's top-level verbs are install/check/fix/test (see README.md); it
# has no "all" or "clean" concept. `test` itself is still required and
# checked — phonydeclared enforces it being PHONY independently of this
# rule. An empty `required` is the rule's own way to require nothing.
[minphony]
required =
